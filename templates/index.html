<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌍 Language Translator</h1>

    <textarea id="inputText" placeholder="Type something..."></textarea>

    <div class="languages">

        <select id="sourceLanguage">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="kn">Kannada</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
        </select>

        <div class="swap" onclick="swapLanguages()">⇄</div>

        <select id="targetLanguage">
            <option value="hi">Hindi</option>
            <option value="en">English</option>
            <option value="kn">Kannada</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
        </select>

    </div>

    <button class="translate-btn" onclick="translateText()">
        🚀 Translate
    </button>

    <h2 class="output-title">Translated Text</h2>

    <textarea id="outputText" readonly></textarea>

    <div class="buttons">

        <button class="copy" onclick="copyText()">
            📋 Copy
        </button>

        <button class="speak" onclick="speakText()">
            🔊 Speak
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
